<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGB Community | Empowering Through Sport</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">FITGB</div>
            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
            </ul>
            <a href="#" class="btn-nav">Register Your Interest</a>
        </nav>
    </header>

    <main class="hero-section">
        <div class="container">
            <!-- Text Content with Animation -->
            <div class="hero-text reveal-left">
                <span class="badge">Hero</span>
                <h1>Empowering Communities Through Sport and Wellbeing</h1>
                <p>Join us at the University of Greenwich for a day of sport, fun, and community engagement designed for everyone.</p>
                <div class="hero-btns">
                    <a href="#" class="btn-main">Register Your Interest</a>
                </div>
            </div>

            <!-- Image Content with Animation -->
            <div class="hero-image reveal-right">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80&w=1000" alt="Community Sports">
                </div>
            </div>
        </div>
    </main>

</body>
</html>
