<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitGB Festival</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    background: white;
}

.logo h2 {
    margin: 0;
}

.logo p {
    margin: 0;
    font-size: 14px;
    color: gray;
}

.nav-links {
    display: flex;
    gap: 30px;
    align-items: center;
}

.nav-links a {
    text-decoration: none;
    color: #333;
}

.register-btn {
    background: #2ecc71;
    color: white;
    padding: 10px 20px;
    border-radius: 25px;
}

/* HERO SECTION */
.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 80px 60px;
}

.hero-text {
    width: 45%;
    font-size: 18px;
    color: #555;
}

.hero-img {
    width: 50%;
}

.hero-img img {
    width: 100%;
    border-radius: 20px;
}
</style>

</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">
        <h2>FitGB Festival</h2>
        <p>Promoting active lifestyles, mental wellbeing, and community connection</p>
    </div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Events</a>
        <a href="#">Register your interest</a>
        <a href="#" class="register-btn">Register</a>
    </div>
</div>

<hr>

<!-- HERO SECTION -->
<div class="hero">
    <div class="hero-text">
        <p>
            Join us at the University of Greenwich for a day of sport,
            health, and community engagement designed for everyone.
        </p>
    </div>

    <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1554284126-aa88f22d8b74" alt="Fitness Event">
    </div>
</div>

</body>
</html>
