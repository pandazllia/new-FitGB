<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGB Community | Sport and Wellbeing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <div class="logo-icon"></div>
                <span class="logo-text">FITGB</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#" class="btn-register-small">Register Your Interest</a>
            </div>
        </nav>
    </header>

    <!-- Main Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <span class="badge-hero">Hero</span>
                <h1>Empowering Communities Through Sport and Wellbeing</h1>
                <p>
                    Join us at the University of Greenwich for a day of sport, 
                    fun, and community engagement designed for everyone.
                </p>
                <a href="#" class="btn-register-large">Register Your Interest</a>
            </div>
            
            <div class="hero-image-area">
                <div class="image-frame">
                    <!-- Standard sports placeholder; replace with your own image file -->
                    <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1000" alt="Football players in action">
                </div>
            </div>
        </div>
    </section>

</body>
</html>
