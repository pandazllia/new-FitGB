<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGB Festival</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="header-animate">
        <nav class="navbar">
            <div class="brand">
                <h1>FitGB Festival</h1>
                <p>Promoting active lifestyles, mental wellbeing, and community connection</p>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="#">register your interest</a></li>
                <li><a href="#" class="btn-register">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="content-wrapper">
            <!-- Left Side Text -->
            <div class="text-side reveal-up">
                <p>Join us at the University of Greenwich for a day of sport, health, and community engagement designed for everyone.</p>
            </div>

            <!-- Right Side Image with Social Overlay -->
            <div class="image-side reveal-right">
                <div class="image-container">
                    <img src="your-image-here.jpg" alt="Yoga session at FitGB Festival">
                    <div class="social-overlay">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-youtube"></i></a>
                        <a href="#"><i class="fab fa-x-twitter"></i></a>
                        <a href="#"><i class="fab fa-linkedin"></i></a>
                        <a href="#"><i class="fab fa-tiktok"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
